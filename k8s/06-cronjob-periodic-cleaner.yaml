apiVersion: batch/v1
kind: CronJob
metadata:
  name: system-periodic-cleaner-cron
  namespace: devops-lab6
  labels:
    app.kubernetes.io/name: periodic-cleaner
    app.kubernetes.io/component: scheduled-maintenance
spec:
  # POSIX cron expression: triggers every 2 minutes
  schedule: "*/2 * * * *"
  # Concurrency control: prevents concurrent executions if previous cycle is still active
  concurrencyPolicy: Forbid
  # Retention policies for past job history
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  # Maximum tolerated delay in seconds if schedule is missed
  startingDeadlineSeconds: 60
  # Job template specification
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: periodic-cleaner-worker
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: periodic-cleaner-pod
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cron-cleaner
              image: lab6-microservice:v1.0.0
              imagePullPolicy: IfNotPresent
              command: ["python", "app.py", "--mode=cron"]
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: POD_IP
                  valueFrom:
                    fieldRef:
                      fieldPath: status.podIP
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: devops-lab6-secret
                      key: DB_USER
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: devops-lab6-secret
                      key: DB_PASSWORD
                - name: API_AUTH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: devops-lab6-secret
                      key: API_AUTH_TOKEN
              envFrom:
                - configMapRef:
                    name: devops-lab6-config
              resources:
                requests:
                  cpu: "50m"
                  memory: "32Mi"
                limits:
                  cpu: "150m"
                  memory: "64Mi"
