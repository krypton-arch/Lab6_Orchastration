apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-web-app
  namespace: devops-lab6
  labels:
    app: devops-web-app
    tier: frontend-dashboard
    version: v1.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-web-app
  template:
    metadata:
      labels:
        app: devops-web-app
        tier: frontend-dashboard
        version: v1.0.0
    spec:
      containers:
        - name: web-dashboard
          image: lab6-microservice:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http-web
          # Inject Downward API metadata
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Inject individual secret keys via secretKeyRef
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: devops-lab6-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devops-lab6-secret
                  key: DB_PASSWORD
            - name: API_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: devops-lab6-secret
                  key: API_AUTH_TOKEN
          # Bulk environment ingestion from ConfigMap
          envFrom:
            - configMapRef:
                name: devops-lab6-config
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          # Volume mounts for ConfigMap and Secret
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config
              readOnly: true
            - name: secret-volume
              mountPath: /etc/secrets
              readOnly: true
          # Health & readiness probes
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2
      volumes:
        - name: config-volume
          configMap:
            name: devops-lab6-config
            items:
              - key: app_settings.json
                path: app_settings.json
        - name: secret-volume
          secret:
            secretName: devops-lab6-secret
            defaultMode: 0400
            items:
              - key: vault_key.txt
                path: vault_key.txt
