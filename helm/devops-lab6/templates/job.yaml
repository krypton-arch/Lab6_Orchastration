{{- if .Values.job.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "devops-lab6.fullname" . }}-{{ .Values.job.name }}
  labels:
    {{- include "devops-lab6.labels" . | nindent 4 }}
spec:
  completions: {{ .Values.job.completions }}
  parallelism: {{ .Values.job.parallelism }}
  backoffLimit: {{ .Values.job.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.job.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "devops-lab6.selectorLabels" . | nindent 8 }}
        batch.kubernetes.io/job-name: {{ include "devops-lab6.fullname" . }}-{{ .Values.job.name }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: batch-processor
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "app.py", "--mode=job"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "devops-lab6.fullname" . }}-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "devops-lab6.fullname" . }}-secret
                  key: DB_PASSWORD
            - name: API_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "devops-lab6.fullname" . }}-secret
                  key: API_AUTH_TOKEN
          envFrom:
            - configMapRef:
                name: {{ include "devops-lab6.fullname" . }}-config
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
