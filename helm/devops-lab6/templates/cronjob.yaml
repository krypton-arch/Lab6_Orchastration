{{- if .Values.cronjob.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "devops-lab6.fullname" . }}-{{ .Values.cronjob.name }}
  labels:
    {{- include "devops-lab6.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  concurrencyPolicy: {{ .Values.cronjob.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.cronjob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cronjob.failedJobsHistoryLimit }}
  startingDeadlineSeconds: {{ .Values.cronjob.startingDeadlineSeconds }}
  jobTemplate:
    metadata:
      labels:
        {{- include "devops-lab6.labels" . | nindent 8 }}
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            {{- include "devops-lab6.selectorLabels" . | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cron-cleaner
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["python", "app.py", "--mode=cron"]
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: POD_IP
                  valueFrom:
                    fieldRef:
                      fieldPath: status.podIP
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "devops-lab6.fullname" . }}-secret
                      key: DB_USER
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "devops-lab6.fullname" . }}-secret
                      key: DB_PASSWORD
                - name: API_AUTH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "devops-lab6.fullname" . }}-secret
                      key: API_AUTH_TOKEN
              envFrom:
                - configMapRef:
                    name: {{ include "devops-lab6.fullname" . }}-config
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
{{- end }}
