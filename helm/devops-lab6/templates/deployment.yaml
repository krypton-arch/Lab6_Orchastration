apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devops-lab6.fullname" . }}-dashboard
  labels:
    {{- include "devops-lab6.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "devops-lab6.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "devops-lab6.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: web-dashboard
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http-web
              containerPort: 5000
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "devops-lab6.fullname" . }}-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "devops-lab6.fullname" . }}-secret
                  key: DB_PASSWORD
            - name: API_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "devops-lab6.fullname" . }}-secret
                  key: API_AUTH_TOKEN
          envFrom:
            - configMapRef:
                name: {{ include "devops-lab6.fullname" . }}-config
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config
              readOnly: true
            - name: secret-volume
              mountPath: /etc/secrets
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "devops-lab6.fullname" . }}-config
            items:
              - key: app_settings.json
                path: app_settings.json
        - name: secret-volume
          secret:
            secretName: {{ include "devops-lab6.fullname" . }}-secret
            defaultMode: 0400
            items:
              - key: vault_key.txt
                path: vault_key.txt
