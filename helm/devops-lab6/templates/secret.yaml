apiVersion: v1
kind: Secret
metadata:
  name: {{ include "devops-lab6.fullname" . }}-secret
  labels:
    {{- include "devops-lab6.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USER: {{ .Values.secret.dbUser | quote }}
  DB_PASSWORD: {{ .Values.secret.dbPassword | quote }}
  API_AUTH_TOKEN: {{ .Values.secret.apiAuthToken | quote }}
  vault_key.txt: {{ .Values.secret.vaultKey | quote }}
